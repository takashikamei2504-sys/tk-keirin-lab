name: Inspect MRT lineup source markup
on:
  pull_request:
    paths: ['.github/workflows/pages-compare-diagnose.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 -u - <<'PY'
          import re,time,urllib.request,urllib.error
          from mrt.entry import parse_entry
          for rid in ('202611253402','202611254804','202611256102','202611253801'):
              url='https://keirin.netkeiba.com/race/entry/?race_id='+rid
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'TK-KEIRIN-LAB/1.0 (public entry research)'})
                  with urllib.request.urlopen(req,timeout=15) as resp: html=resp.read().decode('utf-8')
                  print('CARD',rid,parse_entry(html,rid)['lines'])
                  section=re.search(r'<section class="[^"]*DeployYoso[^"]*"[^>]*>(.*?)</section>',html,re.S)
                  print('DEPLOY',section[0][:10000] if section else 'missing')
                  for pat in ('DeployYoso','Shaban_Num','WakuSeparat','並び予想','ライン予想'):
                      print('MATCH',pat,len(list(re.finditer(pat,html))))
                  time.sleep(1.1)
              except urllib.error.HTTPError as e:
                  print('HTTP',e.code)
                  if e.code in (401,403,429):raise SystemExit('Source access paused')
          PY
