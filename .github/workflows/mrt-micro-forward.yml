name: MRT MICRO third-leg and capital forward-only research
on:
  workflow_dispatch:
  schedule:
    # 10:42, 13:42, 16:42, 19:42, 22:42 JST (GitHub may delay).
    # Also 08:16 JST for overnight reconciliation.
    - cron: '42 1,4,7,10,13 * * *'
    - cron: '16 23 * * *'
  pull_request:
    paths:
      - 'mrt/micro_forward.py'
      - 'mrt/teacher_pair_research.py'
      - 'mrt/allocation_audit.py'
      - 'tests/mrt/test_micro_forward.py'
      - '.github/workflows/mrt-micro-forward.yml'
permissions:
  contents: write
concurrency:
  group: mrt-micro-shadow-${{ github.ref }}
  cancel-in-progress: false
jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mrt/requirements.txt
      - run: pip install -r mrt/requirements.txt
      - name: Verify 100 yen units, pre-close freeze, no-backfill and no-buy
        run: python -m unittest discover -s tests/mrt -p 'test_micro_forward.py'
      - name: Training preflight on research PR (zero frozen bets)
        if: github.event_name == 'pull_request'
        run: python -m mrt.micro_forward --mode dry-run
      - name: Freeze today-only paper tickets BEFORE sales close
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python -m mrt.micro_forward --mode freeze --output data/mrt_research/micro_forward/freeze_status.json
      - name: Compare immutable freeze with verified final results only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python -m mrt.micro_forward --mode evaluate --output data/mrt_research/micro_forward/latest.json
      - name: Persist exclusively research snapshots and reports
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/mrt_research/micro_forward
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze MICRO third and bankroll shadow plans; no production changes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mrt-micro-forward-research
          path: |
            data/mrt_research/micro_forward/latest.json
            data/mrt_research/micro_forward/freeze_status.json
          if-no-files-found: ignore
