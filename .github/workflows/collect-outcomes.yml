name: Collect results and evaluate frozen forecasts
on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/collect_outcomes.py', 'scripts/update_outcomes.cjs', 'js/results-audit.js', 'js/race-feed.js', 'js/race-brain-v2.js', '.github/workflows/collect-outcomes.yml']
permissions:
  contents: write
concurrency:
  group: keirin-outcomes
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tests/results-audit.test.cjs
      - run: python -u scripts/collect_outcomes.py --days 7
      - name: Save frozen forecasts, results and evaluation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lab_history data/lab_evaluation.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save frozen LAB forecasts and update reported race outcomes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
