name: Confirm year-wide inferred race labels against historical archive titles
on:
  push:
    branches: ['research/year-stage-validation-20261116']
    paths:
      - reports/year-race-type/crossyear-stage-sample.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: year-external-title-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate <=50 held-out historic program labels with robot-respecting access
        run: python scripts/year-stage-crossyear-title-validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: crossyear-external-program-title-verification
          path: reports/year-race-type/crossyear-stage-title-validation.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve independent historical title validation on research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/year-race-type/crossyear-stage-title-validation.json
          if ! git diff --cached --quiet; then
            git commit -m 'Audit 2025-26 historic stage labels via bounded independent titles'
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
