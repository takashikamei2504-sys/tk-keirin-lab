name: Archive Railway MICRO odds
on:
  schedule:
    - cron: '23 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: micro-odds-backup
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m scripts.micro_odds_backup
      - name: Commit split observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mrt_odds
          if ! git diff --cached --quiet; then
            git commit -m 'Archive split MICRO odds observations from Railway'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
