name: Collect periodic MICRO trifecta odds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mrt/odds.py', '.github/workflows/mrt-odds.yml']
  pull_request:
    paths: ['mrt/odds.py', 'tests/mrt/test_odds.py', 'tests/mrt-odds-view.test.cjs', 'tests/mrt-odds-browser.cjs', 'tests/fixtures/mrt-trifecta.html', 'js/mrt-odds-view.js', 'js/mrt-micro-view.js', 'mrt-micro.html', '.github/workflows/mrt-odds.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('mrt-odds-pr-{0}', github.ref) || 'mrt-odds-main' }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify complete odds, identity, clocks and price-aware plans
        run: |
          python -m unittest discover -s tests/mrt -p test_odds.py
          node tests/mrt-odds-view.test.cjs
      - name: Verify the mobile odds panel on a fixed pre-close observation
        if: github.event_name == 'pull_request'
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          node tests/mrt-odds-browser.cjs
      - name: Collect current public odds and write independent MICRO plan
        id: collect
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python -m mrt.odds
      - name: Preserve quotes, plans and any source failure status
        if: github.event_name == 'workflow_dispatch' && !cancelled()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/mrt_odds
          if ! git diff --cached --quiet; then
            git commit -m 'Capture periodic trifecta odds and MICRO price-aware plans'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - name: Report blocked or failed collection after saving evidence
        if: github.event_name == 'workflow_dispatch' && steps.collect.outcome == 'failure'
        run: exit 1
