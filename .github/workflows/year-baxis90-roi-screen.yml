name: BAXIS 90-day ROI-gates walk-forward (research)
on:
  push:
    branches: ['research/annual-full-audit-20261116']
    paths:
      - scripts/year-baxis90-roi-screen.cjs
      - .github/workflows/year-baxis90-roi-screen.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: tk-baxis90-roi-screen-${{ github.ref }}
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: complete90-eight-engine-all-race-results
          run-id: 43796244008
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/year-race-type
      - uses: actions/download-artifact@v4
        with:
          pattern: baxis90-v06-part-*
          run-id: 43854561054
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/year-race-type/baxis90-shards
      - name: Audit and run 15 predeclared retrospective gates on next five days
        run: |
          node --check scripts/year-baxis90-roi-screen.cjs
          node scripts/year-baxis90-roi-screen.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baxis90-roi-screen-15-policy
          path: |
            reports/year-race-type/baxis90-roi-gates-walkforward-20261116.json
            reports/year-race-type/baxis90-roi-gates-walkforward-20261116-ja.md
          if-no-files-found: warn
          retention-days: 90
      - name: Commit research report only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add reports/year-race-type/baxis90-roi-gates-walkforward-20261116.json reports/year-race-type/baxis90-roi-gates-walkforward-20261116-ja.md
          if ! git diff --cached --quiet; then
            git commit -m 'Evaluate 15 historical ROI gating rules with no lookahead'
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
