name: Save and evaluate race-routed forecasts
on:
  schedule:
    - cron: '8,28,48 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/routed-*.cjs', 'js/routing/evaluation.js', '.github/workflows/routed-daily.yml']
  workflow_run:
    workflows: ['Collect results and evaluate frozen forecasts']
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: routed-daily
  cancel-in-progress: false
jobs:
  collect:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/routed-daily.test.cjs
      - run: node scripts/routed-daily.cjs
      - name: Persist forecasts and daily evaluation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/routed_history
          if ! git diff --cached --quiet; then
            git commit -m 'Save automatic race forecasts and update daily evaluation'
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
