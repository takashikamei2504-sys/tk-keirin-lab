name: Save and evaluate race-routed forecasts
on:
  schedule:
    - cron: '8,28,48 * * * *' # Forecast capture
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/routed-*.cjs', 'scripts/crossline-selected-daily.cjs', 'js/crossline/selected.js', 'js/routing/evaluation.js', '.github/workflows/routed-daily.yml']
permissions:
  contents: write
concurrency:
  group: routed-daily
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/routed-daily.test.cjs
      - run: node tests/mansha-shadow.test.cjs
      - name: Capture forecasts or check results
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            node scripts/routed-daily.cjs
          else
            node scripts/routed-daily.cjs --scheduled
          fi
      - name: Independent cross-line 4-ticket forecasts and settlement
        continue-on-error: true
        run: |
          node tests/crossline-selected.test.cjs
          node scripts/crossline-selected-daily.cjs
      - name: Persist forecasts and daily evaluation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/routed_history
          if [ -d data/crossline_selected ]; then git add data/crossline_selected; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Save automatic race forecasts and update daily evaluation'
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
