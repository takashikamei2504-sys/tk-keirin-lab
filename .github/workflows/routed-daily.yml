name: Save and evaluate race-routed forecasts
on:
  schedule:
    - cron: '8,28,48 * * * *' # Forecast capture
    - cron: '8 9 * * *' # 18:08 JST
    - cron: '28 15,20 * * *' # 00:28 and 05:28 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/routed-*.cjs', 'js/routing/evaluation.js', '.github/workflows/routed-daily.yml']
permissions:
  contents: write
concurrency:
  group: routed-daily
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/routed-daily.test.cjs
      - name: Capture forecasts or check results
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            node scripts/routed-daily.cjs
          elif [[ "$EVENT" == "schedule" && "$SCHEDULE" != '8,28,48 * * * *' ]]; then
            node scripts/routed-daily.cjs --results-only
          else
            node scripts/routed-daily.cjs --forecasts-only
          fi
      - name: Persist forecasts and daily evaluation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/routed_history
          if ! git diff --cached --quiet; then
            git commit -m 'Save automatic race forecasts and update daily evaluation'
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
