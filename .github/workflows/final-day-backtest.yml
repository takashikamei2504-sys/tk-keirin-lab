name: Historical final-day consolation engine replay
on:
  push:
    branches: ['research/final-day-losses-20261115']
    paths:
      - 'scripts/final-day-backtest.cjs'
      - '.github/workflows/final-day-backtest.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: final-day-replay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify baseline engine tests
        run: node tests/race-routing.test.cjs && node tests/b-upset.test.cjs
      - name: Historical replay (uniform 60-race sample)
        env:
          FINAL_MAX: 60
        run: node scripts/final-day-backtest.cjs
      - name: Persist research report only on research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/final-day/historical-20260816-20261107.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record final-day consolation historical comparison'
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
