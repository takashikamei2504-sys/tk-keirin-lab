name: LINE cognition focused audit
on:
  pull_request:
    paths:
      - 'scripts/line-cognition-audit.cjs'
      - '.github/workflows/line-cognition-audit.yml'
  push:
    branches:
      - 'feat/lab-line-cognition-audit-*'
jobs:
  cognition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/line-cognition-audit.cjs
