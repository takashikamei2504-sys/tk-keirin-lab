name: MICRO TAIL V1 independent research
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['MrT V3 manual B forecasts and checks']
    types: [completed]
    branches: [main]
  pull_request:
    paths: ['mrt/micro_tail_forward.py','tests/mrt/test_micro_tail_forward.py','.github/workflows/mrt-micro-tail-forward.yml','mrt-tail.html']
permissions:
  contents: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tail-pr-{0}', github.ref) || 'mrt-tail-research-main' }}
  cancel-in-progress: false
jobs:
  research:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mrt/requirements.txt
      - run: pip install -r mrt/requirements.txt
      - run: python -m unittest discover -s tests/mrt -p test_micro_tail_forward.py
      - if: github.event_name == 'pull_request'
        run: python -m mrt.micro_tail_forward --mode dry-run
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python -m mrt.micro_tail_forward --mode freeze
          python -m mrt.micro_tail_forward --mode evaluate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/mrt_research/micro_tail_forward
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze independent TAIL V1 research only'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
