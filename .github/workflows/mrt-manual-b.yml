name: MrT V3 manual B forecasts and checks
on:
  push:
    branches: [main, feat/mrt-manual-b]
    paths: ['mrt/**', 'mrt.html', 'js/mrt/**', 'css/mrt.css', 'tests/mrt/**', '.github/workflows/mrt-manual-b.yml']
  pull_request:
    paths: ['mrt/**', 'mrt.html', 'js/mrt/**', 'css/mrt.css', 'tests/mrt/**', '.github/workflows/mrt-manual-b.yml']
  workflow_dispatch:
  schedule:
    - cron: '4,34 * * * *'
permissions:
  contents: write
concurrency:
  group: mrt-v3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mrt/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r mrt/requirements.txt
      - run: python -m unittest discover -s tests/mrt -p 'test_*.py'
      - run: node tests/mrt/core.test.cjs
      - run: node tests/mrt/formation.test.cjs
      - if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: npm install --ignore-scripts && npx playwright install --with-deps chromium webkit
      - if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: node tests/mrt/browser.cjs && MRT_BROWSER=webkit node tests/mrt/browser.cjs
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python -m mrt.publish && python -m mrt.results
      - name: Freeze research candidate beside current predictions
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        run: python -m mrt.shadow
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mrt
          if [ -d data/mrt_research ]; then git add data/mrt_research/forward data/mrt_research/shadow_status.json 2>/dev/null || true; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze MrT V3 automatic and manual B options'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mrt-v3-verification
          path: reports/mrt/
