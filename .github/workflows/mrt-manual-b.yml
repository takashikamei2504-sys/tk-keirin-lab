name: MrT V3 manual B forecasts and checks
on:
  push:
    branches: [main, feat/mrt-manual-b]
    paths: ['mrt/**', 'mrt.html', 'js/mrt/**', 'css/mrt.css', 'tests/mrt/**', 'scripts/mrt_runtime_health.py', '.github/workflows/mrt-manual-b.yml']
  pull_request:
    paths: ['mrt/**', 'mrt.html', 'js/mrt/**', 'css/mrt.css', 'tests/mrt/**', 'scripts/mrt_runtime_health.py', '.github/workflows/mrt-manual-b.yml']
  workflow_dispatch:
  schedule:
    - cron: '4,34 * * * *'
  workflow_run:
    workflows: ['Collect results and evaluate frozen forecasts']
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'mrt-runtime-main' || format('mrt-runtime-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false
jobs:
  verify-and-publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
      - name: Fallback freshness gate
        id: gate
        env:
          MRT_TRIGGER: ${{ github.event_name }}
        run: python3 scripts/mrt_runtime_health.py --gate
      - uses: actions/setup-python@v5
        if: ${{ steps.gate.outputs.run == 'true' }}
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mrt/requirements.txt
      - uses: actions/setup-node@v4
        if: ${{ steps.gate.outputs.run == 'true' }}
        with:
          node-version: '22'
      - if: ${{ steps.gate.outputs.run == 'true' }}
        run: pip install -r mrt/requirements.txt
      - if: ${{ steps.gate.outputs.run == 'true' }}
        run: python -m unittest discover -s tests/mrt -p 'test_*.py'
      - if: ${{ steps.gate.outputs.run == 'true' }}
        run: node tests/mrt/core.test.cjs && node tests/mrt/formation.test.cjs
      - if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
        run: npm install --ignore-scripts && npx playwright install --with-deps chromium webkit
      - if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
        run: node tests/mrt/browser.cjs && MRT_BROWSER=webkit node tests/mrt/browser.cjs
      - name: Reuse fixed MIRROR FUSION model
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.gate.outputs.run == 'true' }}
        uses: actions/cache@v4
        with:
          path: research-build
          key: mirror-fusion-fixed-v1-${{ hashFiles('mrt/mirror_engine.py','mrt/mirror_benchmark.py','mrt/mirror_hierarchy_benchmark.py','mrt/mirror_tier_quota_benchmark.py','mrt/research_seed_manifest.json','mrt/requirements.txt') }}
      - name: 1. Publish MRT input and original predictions
        id: publish
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.gate.outputs.run == 'true' }}
        continue-on-error: true
        timeout-minutes: 9
        run: python -m mrt.publish
      - name: 2. Freeze MICRO independently using the new MRT snapshot
        id: micro
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.gate.outputs.run == 'true' && steps.publish.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 4
        run: python -m mrt.micro_forward --mode freeze --output data/mrt_research/micro_forward/freeze_status.json
      - name: 3. Freeze fixed FUSION independently using the same MRT snapshot
        id: fusion
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.gate.outputs.run == 'true' && steps.publish.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if [ ! -f research-build/mirror-fusion-v1.joblib ]; then
            python -m mrt.mirror_engine train --model research-build/mirror-fusion-v1.joblib
          fi
          python -c 'from mrt.mirror_compare import freeze_day; import json; print(json.dumps(freeze_day("research-build/mirror-fusion-v1.joblib"),ensure_ascii=False))'
      - name: 4. Reconcile final race results
        id: results
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.gate.outputs.run == 'true' }}
        continue-on-error: true
        timeout-minutes: 7
        run: python -m mrt.results
      - name: Freeze research candidate beside current predictions
        id: shadow
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.gate.outputs.run == 'true' && steps.publish.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: python -m mrt.shadow
      - name: 5. Evaluate MICRO and update its viewer
        id: micro_eval
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.gate.outputs.run == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python -m mrt.micro_forward --mode evaluate --output data/mrt_research/micro_forward/latest.json
          python scripts/mrt_micro_view_index.py
      - name: 6. Evaluate three-way frozen cohort
        id: compare
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.gate.outputs.run == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        run: python -m mrt.mirror_compare
      - name: 7. Record runtime health, then save completed data together
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.gate.outputs.run == 'true' && steps.publish.outcome != '' }}
        env:
          MRT_TRIGGER: ${{ github.event_name }}
          MRT_PUBLISH: ${{ steps.publish.outcome }}
          MRT_MICRO: ${{ steps.micro.outcome }}
          MRT_FUSION: ${{ steps.fusion.outcome }}
          MRT_RESULTS: ${{ steps.results.outcome }}
          MRT_SHADOW: ${{ steps.shadow.outcome }}
          MRT_MICRO_EVAL: ${{ steps.micro_eval.outcome }}
          MRT_COMPARE: ${{ steps.compare.outcome }}
        run: |
          python scripts/mrt_runtime_health.py --report
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/mrt
          if [ -d data/mrt_research/micro_forward ]; then git add -A -- data/mrt_research/micro_forward; fi
          if [ -d data/mrt_research/mirror_fusion ]; then git add -A -- data/mrt_research/mirror_fusion; fi
          if [ -f data/mrt_research/runtime_status.json ]; then git add -- data/mrt_research/runtime_status.json; fi
          if [ -d data/mrt_research/forward ]; then git add -A -- data/mrt_research/forward; fi
          if [ -f data/mrt_research/shadow_status.json ]; then git add -- data/mrt_research/shadow_status.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh MRT and independent research snapshots in one coordinated run'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 3
            done
          fi
      - name: Surface partial failures after preserving successful outputs
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.gate.outputs.run == 'true' }}
        run: python scripts/mrt_runtime_health.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mrt-v3-verification
          path: |
            reports/mrt/
            data/mrt_research/runtime_status.json
          if-no-files-found: ignore
