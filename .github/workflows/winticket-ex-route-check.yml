name: WINTICKET EX source route verification
on:
  push:
    branches: ['feature/winticket-ex-extraction-20261108']
    paths:
      - 'scripts/winticket_ex_*.cjs'
      - 'tests/winticket-ex-extract.test.cjs'
      - '.github/workflows/winticket-ex-route-check.yml'
  pull_request:
    paths:
      - 'scripts/winticket_ex_*.cjs'
      - 'tests/winticket-ex-extract.test.cjs'
      - '.github/workflows/winticket-ex-route-check.yml'
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/winticket-ex-extract.test.cjs
  one-page-source-probe:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One permitted public racecard request (no retries, no uploaded data)
        continue-on-error: true
        run: node scripts/winticket_ex_collect.cjs https://www.winticket.jp/keirin/yokkaichi/racecard/2026110548/4/12 /tmp/winticket-ex-probe.json
