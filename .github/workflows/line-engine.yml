name: LAB LINE independent engine
on:
  pull_request:
    paths: ['js/line/**', 'js/brain-memory.js', 'js/recent-form.js', 'js/race-material.js', 'js/model-provenance.js', 'data/line_conditions.json', 'data/line_evaluation.json', 'line.html', 'css/line.css', 'tests/line/**', 'scripts/line*', '.github/workflows/line-engine.yml', '.github/workflows/line-evaluation.yml']
  push:
    branches: ['feat/lab-line-*']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: node scripts/line_identity.cjs && git diff --exit-code -- js/line/build.js
      - run: node tests/line/engine.test.cjs
      - run: node tests/line/positioning.test.cjs
      - run: node tests/line/cut-choice.test.cjs
      - run: node tests/line/effort.test.cjs
      - run: node tests/line/physical.test.cjs
      - run: node tests/line/solo-positioning.test.cjs
      - run: node tests/line/formation.test.cjs
      - run: node tests/line/positioning-evaluation.test.cjs
      - run: node tests/line/interactions.test.cjs
      - run: node tests/line/audit.test.cjs
      - run: node scripts/line-evaluate.cjs
      - run: node scripts/line-positioning-evaluate.cjs
      - run: node scripts/line-checks.cjs
      - run: node scripts/line-examples.cjs
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 >/tmp/line-server.log 2>&1 &
          node tests/line/browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: lab-line-preview-and-predictions
          path: |
            line.html
            js/
            css/
            reports/line/
            data/intelligence.json
            data/recent_form.json
            data/race_material.json
            data/line_conditions.json
            data/line_evaluation.json
            data/line_positioning_evaluation.json
