name: Verify MICRO odds runtime
on:
  pull_request:
    paths: ['ops/micro_odds/**', 'tests/mrt/test_odds_runtime.py']
  push:
    branches: [main]
    paths: ['ops/micro_odds/**', 'tests/mrt/test_odds_runtime.py']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/mrt -p 'test_odds*.py'
      - run: docker build -f ops/micro_odds/Dockerfile -t micro-odds .
