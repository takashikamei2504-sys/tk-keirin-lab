name: Inspect historical public program pages with robots checks
on:
  push:
    branches: ['research/year-stage-validation-20261116']
    paths:
      - scripts/year-keirin0-archive-probe.py
      - .github/workflows/year-keirin0-archive-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe 3 historical cards subject to robots policy
        run: python scripts/year-keirin0-archive-probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: keirin0-archived-program-availability
          path: reports/year-race-type/keirin0-archive-probe.json
          if-no-files-found: error
          retention-days: 30
