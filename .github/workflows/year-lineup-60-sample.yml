name: Recover bounded annual historical lineup sample
on:
  push:
    branches: ['research/annual-lineup-source-20261116']
    paths:
      - scripts/year-lineup-60-sample.py
      - .github/workflows/year-lineup-60-sample.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore original line groups in 60 outcome-blind historical records
        run: |
          python -m py_compile scripts/year-lineup-60-sample.py
          python scripts/year-lineup-60-sample.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: annual-historical-60-lineup-sample
          path: reports/year-race-type/historical-lineup-pilot-202511-202608.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve derived research data on isolated branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/year-race-type/historical-lineup-pilot-202511-202608.json
          if ! git diff --cached --quiet; then
            git commit -m 'Store verified historical lineup structures on 60 selected 2025-26 cards'
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
