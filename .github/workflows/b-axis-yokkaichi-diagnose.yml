name: B-AXIS annual data & Yokkaichi diagnosis
on:
  push:
    branches: ['feature/b-axis-follow-power-history-20261108']
    paths: ['scripts/b_axis_yokkaichi_diagnose.cjs','.github/workflows/b-axis-yokkaichi-diagnose.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/b_axis_yokkaichi_diagnose.cjs
