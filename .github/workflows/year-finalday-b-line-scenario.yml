name: Final-day projected B-line scenarios against eight engines
on:
  push:
    branches: ['research/annual-full-audit-20261116']
    paths:
      - scripts/year-finalday-b-line-scenario.py
      - .github/workflows/year-finalday-b-line-scenario.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: tk-finalday-b-proxy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: complete90-eight-engine-all-race-results
          run-id: 43796244008
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/year-race-type
      - name: Check Python and audit complete 90-day pinned archive and B pilot
        run: |
          python3 -m py_compile scripts/year-finalday-line-topology-audit.py
          python3 -m py_compile scripts/year-finalday-b-line-scenario.py
          python3 scripts/year-finalday-b-line-scenario.py
      - uses: actions/upload-artifact@v4
        with:
          name: finalday-projected-bline-790r-eight-engine
          path: |
            reports/year-race-type/90day-finalday-b-line-scenario-20261116.json
            reports/year-race-type/90day-finalday-b-line-scenario-20261116-ja.md
          if-no-files-found: error
          retention-days: 90
      - name: Commit audited research reports, leave production untouched
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/year-race-type/90day-finalday-b-line-scenario-20261116.json reports/year-race-type/90day-finalday-b-line-scenario-20261116-ja.md
          if ! git diff --cached --quiet; then
            git commit -m 'Evaluate candidate B leaders and nonfavorite line scenarios on final-day losses'
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
