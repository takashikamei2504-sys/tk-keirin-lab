name: Audit historical encoded calendar date consistency
on:
  push:
    branches: ['research/year-race-type-audit-20261116']
    paths:
      - scripts/year-race-type-date-audit.py
      - .github/workflows/year-race-type-date-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify archived race IDs against dates for 13 monthly CSVs
        run: python scripts/year-race-type-date-audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: year-race-type-calendar-integrity
          path: reports/year-race-type/race-id-date-integrity.json
          if-no-files-found: error
          retention-days: 90
      - name: Save research audit without production changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/year-race-type/race-id-date-integrity.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record yearly race identifier calendar consistency'
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
