name: Evaluate frozen LAB LINE forecasts
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Freeze independent LAB LINE forecasts', 'Collect results and evaluate frozen forecasts']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['scripts/roi-audit.cjs', 'js/roi/audit.cjs', 'js/roi/engine.cjs', 'scripts/roi-freeze.cjs', 'js/roi/policy.cjs', 'js/roi/shadow.cjs', 'scripts/roi-shadow-report.cjs', 'scripts/roi-monitor.cjs', 'js/roi/calibration.cjs', 'js/roi/value.cjs', 'data/roi/calibration.json', 'scripts/line-evaluate.cjs', 'js/line/evaluation.js', 'scripts/line-positioning-evaluate.cjs', 'js/line/positioning-evaluation.js', 'data/line_positioning_observations.json', '.github/workflows/line-evaluation.yml']
permissions:
  contents: write
concurrency:
  group: lab-line-evaluation
  cancel-in-progress: false
jobs:
  evaluate:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/line/audit.test.cjs
      - run: node tests/line/positioning-evaluation.test.cjs
      - run: node scripts/line-evaluate.cjs
      - run: node scripts/line-positioning-evaluate.cjs
      - run: node tests/roi-audit.test.cjs
      - run: node tests/roi-engine.test.cjs
      - run: node tests/roi-policy.test.cjs
      - run: node tests/roi-shadow.test.cjs
      - run: node scripts/roi-freeze.cjs
      - run: node scripts/roi-monitor.cjs
      - run: node scripts/roi-audit.cjs
      - name: Save LINE and ROI summaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/line_evaluation.json data/line_positioning_evaluation.json data/roi/audit.json data/roi/prospective.json
          if test -d data/roi/forecasts; then git add data/roi/forecasts; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update frozen LAB LINE evaluation summary'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
