name: Update COVERAGE GATE validation
on:
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
  workflow_run:
    workflows: ['Collect results and evaluate frozen forecasts']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/coverage-gate-report.cjs'
      - 'js/coverage-gate/logic.js'
      - 'tests/coverage-gate.test.cjs'
      - '.github/workflows/coverage-gate.yml'
permissions:
  contents: write
concurrency:
  group: coverage-gate-validation
  cancel-in-progress: false
jobs:
  update:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the immutable forecast gate
        run: node tests/coverage-gate.test.cjs
      - name: Update cumulative validation report
        run: node scripts/coverage-gate-report.cjs
      - name: Commit report only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/coverage_gate/evaluation.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update coverage GATE frozen-forecast validation'
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
