name: Verify brain and mobile screen
on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npx playwright install --with-deps chromium
      - run: |
          python -m http.server 8765 >/tmp/lab-server.log 2>&1 &
          npm run test:browser
