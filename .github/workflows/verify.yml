name: Verify brain and mobile screen
on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts
      - run: node scripts/model_identity.cjs
      - run: git diff --exit-code -- js/model-build.js
      - run: npm test
      - run: node tests/roi-policy.test.cjs
      - run: node tests/roi-operation.test.cjs
      - run: node tests/s-counts.test.cjs
      - run: node tests/recent-form.test.js
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npx playwright install --with-deps chromium webkit
      - run: |
          python -m http.server 8765 >/tmp/lab-server.log 2>&1 &
          npm run test:browser
          node tests/formation-browser.cjs
          node tests/s-riders-browser.cjs
          node tests/results-browser.cjs
          ROI_BROWSER=chromium node tests/roi-browser.cjs
          node tests/roi-browser.cjs
