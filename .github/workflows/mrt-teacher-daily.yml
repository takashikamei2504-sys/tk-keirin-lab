name: Collect public MrT forecasts after all races
on:
  schedule:
    # JST 00:20 / 03:20 / 07:20; latest seven days and known unfinished IDs.
    - cron: '20 15,18,22 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Final date (YYYY-MM-DD, JST); empty means previous race day (JST)'
        required: false
        default: ''
      lookback:
        description: 'Retry window 1..31; empty means 7 (31 on monthly audit)'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['mrt/teacher_*.py', 'tests/mrt/test_teacher_daily.py', '.github/workflows/mrt-teacher-daily.yml']
  pull_request:
    paths: ['mrt/teacher_*.py', 'tests/mrt/test_teacher_daily.py', '.github/workflows/mrt-teacher-daily.yml']
permissions:
  contents: write
concurrency:
  group: mrt-teacher-public-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mrt/requirements.txt
      - run: pip install -r mrt/requirements.txt
      - run: python -m unittest discover -s tests/mrt -p 'test_teacher_daily.py'
      - name: Collect only public post-race references
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          END_DATE: ${{ inputs.date }}
          LOOKBACK_DAYS: ${{ inputs.lookback }}
        run: |
          args=()
          if [ -n "$END_DATE" ]; then args+=(--date "$END_DATE"); fi
          if [ -n "$LOOKBACK_DAYS" ]; then args+=(--lookback "$LOOKBACK_DAYS"); fi
          python -m mrt.teacher_daily "${args[@]}"
      - name: Keep collected references and retry state
        if: always() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if [ -d data/mrt_teacher ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/mrt_teacher
            if ! git diff --cached --quiet; then
              git commit -m 'Collect public MrT reference labels and race results'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mrt-teacher-collection-status
          path: |
            data/mrt_teacher/status.json
            data/mrt_teacher/days/
