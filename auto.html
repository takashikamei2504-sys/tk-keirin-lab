<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d25"><title>レース別エンジン自動選択｜TK KEIRIN LAB</title><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/routing.css?v=3f18375c59d1"></head><body>
<header><a class="brand" href="index.html">TK KEIRIN LAB</a><a href="v14.html">従来の画面</a></header>
<main><p class="eyebrow">RACE × ENGINE</p><h1>レースに合わせて、<br>予想を選ぶ。</h1><p class="lead">級班と車立てからエンジンを自動選択。<br>レースを変えると、展開と三連単も切り替わります。</p>
<section class="card picker" aria-labelledby="picker-title"><h2 id="picker-title">レースを選ぶ</h2><div class="fields"><label>開催日<input id="date" type="date"></label><label>競輪場<select id="venue" disabled></select></label><label>レース<select id="race" disabled></select></label></div><button id="load" type="button" disabled>このレースを予想する</button><p id="status" role="status" aria-live="polite"></p></section>
<section class="card engine" aria-labelledby="engine-title"><div class="heading"><h2 id="engine-title">適用エンジン</h2><span id="category" class="badge"></span></div><label class="sr-only" for="engine">エンジンの選択</label><select id="engine"><option value="auto">自動選択（標準）</option><option value="physical">成立条件修正版</option><option value="roi_coverage">ROI分散選択</option><option value="causal">因果展開・従来</option><option value="lab_v5">LAB現行v5.6</option><option value="line">LAB LINE</option></select><p id="engine-name" class="engine-name">レースを選んでください</p><p id="engine-reason" class="muted"></p><details><summary>自動選択の基準</summary><p>2026年5月8日〜11月7日の基本出走表による比較で、最大の的中払戻を除いた回収率を優先しています。標準の買い目は上位8点までです。</p><dl id="policy-rules"></dl><p id="benchmark" class="muted"></p></details></section>
<div id="output" hidden aria-live="polite"><section class="card"><p id="race-label" class="eyebrow"></p><h2>三連単予想 <span id="ticket-count" class="badge"></span></h2><p id="lineup" class="muted"></p><div id="tickets" class="tickets"></div><p id="compressed" class="compressed"></p><div class="actions"><button id="copy" type="button">買い目をコピー</button><button id="export" class="secondary" type="button">予想と根拠を保存</button></div><p id="save-status" class="muted" role="status"></p></section><section class="card"><h2>展開と採用理由</h2><div id="paths"></div></section><details class="card"><summary>出走選手と情報時点</summary><div id="riders"></div><p id="provenance" class="muted"></p></details></div>
<footer><a href="b-axis.html">B-AXIS</a><a href="line.html">LAB LINE</a><a href="roi.html">回収率</a></footer></main>
<script src="js/model-provenance.js?v=807f5b8b94de"></script><script src="js/race-feed.js?v=e17bdfe21149"></script><script src="js/routing/policy.js?v=b2477a290bd8"></script><script src="js/routing/build.js?v=3fa4d27d9818"></script><script src="js/routing/history.js?v=5fadc148265c"></script><script src="js/routing/app.js?v=7d0429254aa7"></script></body></html>
