<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MICRO-TAIL V1</title>
<style>:root{color-scheme:dark}body{margin:0;background:#101923;color:#edf5fa;font:16px/1.6 system-ui}main{max-width:780px;margin:auto;padding:18px}section{background:#192737;border:1px solid #43556a;border-radius:12px;padding:14px;margin:14px 0}a{color:#77d9dc}select{font:inherit;width:100%;padding:12px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:right;padding:7px;border-bottom:1px solid #43556a}td:first-child,th:first-child{text-align:left}small{color:#c0cbd9}.ticket{font-weight:700;font-size:19px}</style>
<main><a href="mrt-micro.html">MICRO研究へ戻る</a><h1>MICRO-TAIL V1</h1><p>独立前向き研究・閲覧専用。追加各100円、現行と合計1万円。実投票・自動採用なし。</p><section><h2>累積比較</h2><div id="report">読込中</div></section><section><h2>発走前固定予想</h2><select id="race" aria-label="レース"></select><div id="detail"></div></section><small>選択スコアは払戻代理モデルによる研究指標であり、実オッズ・校正済み期待値ではありません。</small></main>
<script>
const base='data/mrt_research/micro_tail_forward/', report=document.querySelector('#report'),detail=document.querySelector('#detail'),race=document.querySelector('#race');
const get=async p=>{let r=await fetch(base+p,{cache:'no-store'});if(!r.ok)throw Error('データ未取得');return r.json()};const pct=v=>v==null?'—':v.toFixed(1)+'%';
function node(tag,t){let x=document.createElement(tag);x.textContent=t;return x}function table(rows){let t=node('table','');for(let r of rows){let tr=node('tr','');for(let x of r)tr.append(node('td',String(x)));t.append(tr)}return t}
async function show(){detail.replaceChildren();if(!race.value)return;try{let s=await get('snapshots/'+race.value+'.json');if(s.race_id!==race.value||!s.frozen||!s.pre_race)throw Error('固定記録不正');detail.append(node('p',s.race_class+' / '+s.field_size+'車'));for(let n of ['1','3']){let t=s.additional[n];detail.append(node('h3','TAIL-'+n+' ・ '+t.length+'点'));detail.append(node('p',t.length?t.map(x=>x.cars.join('-')+' 100円').join(' ／ '):'見送り'))}}catch(e){detail.append(node('p',e.message))}}
async function init(){try{let d=await get('latest.json');report.replaceChildren();for(let [id,p] of Object.entries(d.protocols)){report.append(node('p',id+' / '+p.days+'日 / '+(p.review_ready?'採用検討可・要承認':'検証中')));let r=[['方式','追加購入R','追加ROI','合算ROI'],['現行','—','—',pct(p.summary['1'].base_roi)]];for(let n of ['1','3']){let s=p.summary[n];r.push(['TAIL-'+n,s.active,pct(s.additional_roi),pct(s.combined_roi)])}report.append(table(r));report.append(table([['最高実現払戻除外','TAIL-1','TAIL-3'],...[1,3,5].map(k=>[k+'件',...['1','3'].map(n=>pct(p.summary[n].exclude_realized_keep_cost[k]))])]))}if(!Object.keys(d.protocols).length)report.append(node('p','確定結果待ち'));for(let id of d.race_ids.slice().reverse()){let o=node('option',id.slice(0,8)+' 場'+id.slice(8,10)+' '+Number(id.slice(-2))+'R');o.value=id;race.append(o)}await show()}catch(e){report.textContent=e.message+'（初回研究実行待ち）'}}race.addEventListener('change',show);init();
</script></html>
