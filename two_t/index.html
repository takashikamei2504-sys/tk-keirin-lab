<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102923">
<title>TK KEIRIN LAB 2T TRANSFORMER</title>
<style>
:root{font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;color:#18312b;background:#eff3ed;line-height:1.55}
*{box-sizing:border-box}body{margin:0}header{background:#102923;color:#f5f8f0;padding:1.2rem 1rem 1.5rem}
.wrap{max-width:58rem;margin:auto}header a{color:#ccded4;font-size:.84rem}h1{font-size:clamp(1.2rem,5vw,2.1rem);line-height:1.14;margin:.75rem 0 .4rem;letter-spacing:.02em}
header p{color:#cce4d8;margin:.25rem 0 0}main{padding:1rem}.panel{background:#fff;border:1px solid #d7e2d9;border-radius:1rem;padding:.9rem;margin-bottom:.85rem}
.label{font-size:.82rem;font-weight:700;color:#3c5850}h2{font-size:1.04rem;margin:0 0 .5rem}form{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}label{min-width:0}
select{display:block;width:100%;font:inherit;background:#f7faf7;color:inherit;border:1px solid #9aafa4;border-radius:.5rem;min-height:44px;padding:.4rem}
.strip{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}.strip select{width:auto}.strip h2{margin:0}.tag{background:#e4efe5;padding:.18rem .5rem;border-radius:.3rem;font-size:.76rem;font-weight:700}
p{margin:.5rem 0}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.91rem;table-layout:fixed}
th,td{padding:.56rem .12rem;text-align:right;border-bottom:1px solid #e5ebe6}
th:first-child,td:first-child{text-align:left}th:last-child,td:last-child{text-align:center}th{font-size:.75rem;color:#3c5850}
strong{color:#255b43}small{display:block;color:#436358;overflow-wrap:anywhere}.source{color:#255b43}
[hidden]{display:none!important}
</style>
<header><div class="wrap">
<a href="../index.html">TK KEIRIN LAB ホーム</a>
<h1>TK KEIRIN LAB<br>2T TRANSFORMER</h1>
<p>二車単確率・期待値</p>
</div></header>
<main class="wrap">
<section class="panel"><h2>レース選択</h2>
<form><label class="label">開催日<select id="day"></select></label>
<label class="label">競輪場<select id="venue"></select></label>
<label class="label">レース<select id="race"></select></label>
<label class="label">記録<select id="mode"><option value="replay">確定オッズ研究</option><option value="forward">締切前予測</option></select></label></form>
<p id="state" role="status"></p></section>
<section id="detail" hidden>
<div class="panel"><div class="strip"><h2 id="heading"></h2><span class="tag" id="status"></span></div>
<p id="outcome"></p><small id="time"></small><small id="source"></small></div>
<div class="panel"><h2>EV 1.5以上</h2><p id="candidates"></p></div>
<div class="panel"><div class="strip"><h2 id="count">二車単</h2>
<label class="label" for="sort">並び順<select id="sort"><option value="ev">EV順</option><option value="prob">確率順</option></select></label></div>
<table><thead><tr><th>買い目</th><th>確率</th><th>オッズ</th><th>EV</th><th>EV 1.5</th></tr></thead><tbody id="tickets"></tbody></table></div>
</section>
</main>
<script id="embedded" type="application/json">null</script>
<script type="module">
const el = id => document.getElementById(id);
const fmt = x => new Intl.NumberFormat('ja-JP').format(x);
const pct = p => (p * 100).toFixed(2) + '%';
const dateTime = value => new Intl.DateTimeFormat('ja-JP', {
  timeZone:'Asia/Tokyo', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit'
}).format(new Date(value));
const embedded = JSON.parse(el('embedded').textContent);
let records = embedded;
if (records === null) {
  try {
    const response = await fetch('./race-records.json');
    if (response.ok) records = await response.json();
  } catch (error) {
    if (location.protocol !== 'file:') console.error(error);
  }
}
const data = records || {replay:[], forward:[]};
const mode = el('mode'), day = el('day'), venue = el('venue'), race = el('race'), sort = el('sort');
function options(select, values, label = v => v) {
  const prior = select.value;
  select.replaceChildren(...values.map(v => new Option(label(v), v)));
  if (values.includes(prior)) select.value = prior;
  select.disabled = values.length === 0;
}
const unique = values => [...new Set(values)];
function filter() {
  const all = data[mode.value] || [];
  options(day, unique(all.map(r => r.date)).sort().reverse());
  const byDay = all.filter(r => r.date === day.value);
  options(venue, unique(byDay.map(r => r.venue)).sort((a,b) => a.localeCompare(b,'ja')));
  const byVenue = byDay.filter(r => r.venue === venue.value).sort((a,b) => a.race_no-b.race_no);
  options(race, byVenue.map(r => r.key || r.race_id), id => {
    const r = byVenue.find(r => (r.key || r.race_id) === id);
    return r.race_no + 'R ・ ' + ({S:'S級',A:'A級',challenge:'チャレンジ'}[r.class] || r.class)
      + ' ・ ' + r.cars.length + '車' + (r.quote_mode === 't5' ? ' ・ 5分前' : r.quote_mode === 'probability' ? ' ・ 確率のみ' : '');
  });
  render();
}
function render() {
  const r = (data[mode.value] || []).find(r => (r.key || r.race_id) === race.value);
  el('detail').hidden = !r;
  el('state').textContent = r ? '' : mode.value === 'forward' ?
    '締切前に固定した予測はまだありません。' : '公開済みの過去検証データがありません。';
  if (!r) return;
  const isReplay = mode.value === 'replay';
  const odds = r.quote?.odds;
  el('heading').textContent = r.venue + ' ' + r.race_no + 'R ・ ' + r.cars.length + '車';
  const closed = !isReplay && Date.now() >= Date.parse(r.quote?.sales_close || r.start);
  el('status').textContent = isReplay ? '過去検証' : closed ? '締切済み' : r.frozen_at ? '発走前固定済み' : '保存待ち';
  el('time').textContent = (isReplay ? '発走前資料の保存 ' : '予測の保存 ') + dateTime(r.frozen_at ?? r.input_as_of);
  el('source').textContent = isReplay ? '確定オッズ利用・実購入再現不可' : odds ?
    '締切' + (r.quote_mode === 't5' ? '5' : '10') + '分前 ・ 取得 ' + dateTime(r.quote.captured_at) : '締切前オッズなし・確率のみ';
  if (isReplay && r.result?.accident) el('source').textContent += ' ・ 論文比較対象外';
  const winners = Object.entries(r.result?.payouts || {});
  el('outcome').textContent = r.result?.cancelled ? '中止' : winners.length ?
    '二車単結果 ' + winners.map(([key, value]) => key + '（' + fmt(value) + '円）').join(' / ')
       + (r.settlement?.tickets ? ' ・ ' + (r.settlement.hits ? '的中 ' : '不的中 ') + fmt(r.settlement.returned) + '円' : '')
       + (r.cumulative_roi == null ? '' : ' ・ 累積回収率 ' + pct(r.cumulative_roi)) :
    '結果照合待ち';
  const rows = Object.entries(r.probabilities).map(([key,p]) => {
    const o = odds?.[key] ?? null;
    return {key,p,o,ev:o === null ? null : p*o};
  }).sort((a,b) => sort.value === 'ev' && odds ? b.ev-a.ev || b.p-a.p : b.p-a.p);
  const buy = rows.filter(row => row.ev >= 1.5);
  const label = isReplay ? '仮想購入' : closed ? '当時の候補' : '購入候補';
  el('candidates').textContent = !odds ? 'オッズ待ち' : !buy.length ? '条件該当なし' :
    label + ' ' + buy.length + '点 ・ ' + fmt(buy.length*100) + '円 ｜ ' + buy.map(row => row.key).join('、');
  el('count').textContent = '二車単 ' + rows.length + '通り';
  el('tickets').replaceChildren(...rows.map(row => {
    const tr = document.createElement('tr');
    for (const value of [row.key,pct(row.p),row.o ?? '—',row.ev?.toFixed(2) ?? '—',row.ev === null ? '—' : row.ev >= 1.5 ? '該当' : '']) {
      tr.insertCell().textContent = value;
    }
    return tr;
  }));
}
for (const control of [mode, day, venue]) control.addEventListener('change', filter);
for (const control of [race, sort]) control.addEventListener('change', render);
filter();
</script>
</html>
