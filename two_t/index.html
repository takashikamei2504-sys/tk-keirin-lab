<!doctype html>
<html lang="ja">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>TK KEIRIN LAB 2T TRANSFORMER</title>
<style>
:root{font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;color:#18312b;background:#eff3ed;line-height:1.55}
*{box-sizing:border-box}body{margin:0}header{background:#102923;color:#f5f8f0;padding:1.2rem 1rem 1.5rem}
.wrap{max-width:58rem;margin:auto}header a{color:#ccded4;font-size:.84rem}h1{font-size:clamp(1.2rem,5vw,2.1rem);line-height:1.14;margin:.75rem 0 .4rem;letter-spacing:.02em}
header p{color:#cce4d8;margin:.25rem 0 0}main{padding:1rem}.panel{background:#fff;border:1px solid #d7e2d9;border-radius:1rem;padding:.9rem;margin-bottom:.85rem}
.label{font-size:.82rem;font-weight:700;color:#3c5850}h2{font-size:1.04rem;margin:0 0 .5rem}form{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}label{min-width:0}
select{display:block;width:100%;font:inherit;background:#f7faf7;color:inherit;border:1px solid #9aafa4;border-radius:.5rem;min-height:44px;padding:.4rem}
.strip{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}.strip select{width:auto}.strip h2{margin:0}.tag{background:#e4efe5;padding:.18rem .5rem;border-radius:.3rem;font-size:.76rem;font-weight:700}
p{margin:.5rem 0}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.91rem;table-layout:fixed}
th,td{padding:.56rem .12rem;text-align:right;border-bottom:1px solid #e5ebe6}
th:first-child,td:first-child{text-align:left}th:last-child,td:last-child{text-align:center}th{font-size:.75rem;color:#3c5850}
strong{color:#255b43}small{display:block;color:#436358;overflow-wrap:anywhere}.source{color:#255b43}
[hidden]{display:none!important}
.archive-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem;margin:.7rem 0}
.archive-query{grid-column:1/-1}
.archive-query input{display:block;width:100%;min-height:44px;padding:.5rem .65rem;border:1px solid #9aafa4;border-radius:.5rem;background:#f7faf7;color:inherit;font:inherit}
.archive-list{list-style:none;margin:.5rem 0;padding:0}
.archive-list li{border-top:1px solid #e5ebe6;padding:.55rem 0}
.archive-list summary{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:.45rem;cursor:pointer}
.archive-list summary .tag{flex-shrink:0}
.archive-list details[open] summary .archive-title{color:#255b43}
.archive-list details[open] summary{margin-bottom:.4rem}
.archive-list details p{overflow-wrap:anywhere;font-size:.88rem}
.archive-list details small{margin:.25rem 0}
.archive-actions{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.5rem}
.archive-actions button,#archive-more{font:inherit;font-size:.88rem;min-height:44px;padding:.35rem .6rem;color:#24533d;background:#f0f6ef;border:1px solid #9aafa4;border-radius:.5rem;cursor:pointer}
.quick-controls{display:flex;align-items:end;gap:.6rem;flex-wrap:wrap}
.quick-controls label{flex:1 1 13rem}
.quick-submit{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.45rem .85rem;background:#255b43;color:#fff;border-radius:.5rem;text-decoration:none;font-weight:700}
.quick-results{margin-top:.85rem;border-top:1px solid #d7e2d9;padding-top:.65rem}
.quick-results h3{font-size:.95rem;margin:0}
.quick-results ul{margin:.4rem 0;padding:0;list-style:none}
.quick-results li{padding:.4rem 0}
.quick-results li a{color:#255b43}
.quick-fallback{font-size:.82rem;color:#255b43}
#archive-count{font-size:.82rem;color:#3c5850}
#detail{scroll-margin-top:.75rem}
@media(min-width:40rem){.archive-controls{grid-template-columns:repeat(4,minmax(0,1fr))}.archive-query{grid-column:1/-1}}
</style>
<header><div class="wrap">
<a href="../index.html">TK KEIRIN LAB ホーム</a>
<a style="margin-left:1rem" href="#quick">当日レースを手動取得</a>
<h1>TK KEIRIN LAB<br>2T TRANSFORMER</h1>
<p>二車単確率・期待値</p>
</div></header>
<main class="wrap">
<section class="panel" id="quick" aria-labelledby="quick-heading">
<h2 id="quick-heading">当日レースを手動取得</h2>
<div id="quick-controls" class="quick-controls" hidden>
<label class="label">対象レース<select id="quick-race"></select></label>
<a class="quick-submit" id="quick-submit">GitHubで依頼を送る</a>
</div>
<p id="quick-status" class="label" role="status">当日のレースを読み込み中…</p>
<a class="quick-fallback" href="https://github.com/takashikamei2504-sys/tk-keirin-lab/actions/workflows/two-t-observe.yml">掲載されていないレースを手動指定</a>
<div class="quick-results">
<div class="strip"><h3>今日の手動取得結果</h3><div class="archive-actions"><button type="button" id="quick-refresh">結果を更新</button></div></div>
<p id="quick-results-empty" class="label">当日の処理結果はまだありません。</p>
<ul id="quick-results"></ul>
</div>
</section>
<section class="panel" aria-labelledby="archive-heading">
<div class="strip"><h2 id="archive-heading">レース台帳</h2><span id="archive-count" role="status"></span></div>
<p id="archive-sync" class="label" hidden></p>
<div class="archive-controls">
<label class="label archive-query">検索<input id="archive-query" type="search" placeholder="競輪場・レース番号・選手名" autocomplete="off"></label>
<label class="label">開催日<select id="archive-day"></select></label>
<label class="label">競輪場<select id="archive-venue"></select></label>
<label class="label">車立て<select id="archive-field"><option value="">すべて</option><option value="7">7車</option><option value="9">9車</option></select></label>
<label class="label">記録状況<select id="archive-state"><option value="">すべて</option><option value="settled">仮想精算済み</option><option value="pending">予測あり・照合待ち</option><option value="matched">結果照合済み</option><option value="card">出走表保存</option><option value="replay">確定オッズ研究</option></select></label>
</div>
<ul class="archive-list" id="archive-list"></ul>
<p id="archive-empty" hidden></p><button type="button" id="archive-more" hidden>さらに表示</button>
</section>
<section class="panel"><h2>予測詳細の選択</h2>
<form><label class="label">開催日<select id="day"></select></label>
<label class="label">競輪場<select id="venue"></select></label>
<label class="label">レース<select id="race"></select></label>
<label class="label">記録<select id="mode"><option value="replay">確定オッズ研究</option><option value="forward">締切前予測</option></select></label></form>
<p id="state" role="status"></p></section>
<section id="detail" hidden>
<div class="panel"><div class="strip"><h2 id="heading" tabindex="-1"></h2><span class="tag" id="status"></span></div>
<p id="outcome"></p><small id="time"></small><small id="source"></small></div>
<div class="panel"><h2>EV 1.5以上</h2><p id="candidates"></p></div>
<div class="panel"><div class="strip"><h2 id="count">二車単</h2>
<label class="label" for="sort">並び順<select id="sort"><option value="ev">EV順</option><option value="prob">確率順</option></select></label></div>
<table><thead><tr><th>買い目</th><th>確率</th><th>オッズ</th><th>EV</th><th>EV 1.5</th></tr></thead><tbody id="tickets"></tbody></table></div>
</section>
</main>
<script id="embedded" type="application/json">null</script>
<script type="module">
const el = id => document.getElementById(id);
const fmt = x => new Intl.NumberFormat('ja-JP').format(x);
const pct = p => (p * 100).toFixed(2) + '%';
const dateTime = value => new Intl.DateTimeFormat('ja-JP', {
  timeZone:'Asia/Tokyo', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit'
}).format(new Date(value));
const embedded = JSON.parse(el('embedded').textContent);
let records = embedded;
if (records === null) {
  try {
    const response = await fetch('./race-records.json');
    if (response.ok) records = await response.json();
  } catch (error) {
    if (location.protocol !== 'file:') console.error(error);
  }
}
const data = records || {replay:[], forward:[]};
if (embedded === null && location.hostname === 'takashikamei2504-sys.github.io') {
  const status = el('archive-sync');
  try {
    const response = await fetch('https://raw.githubusercontent.com/takashikamei2504-sys/tk-keirin-lab/lab-2t-observations/public/race-records.json',
      {signal:AbortSignal.timeout(5000)});
    if (!response.ok) throw new Error('Observation feed HTTP ' + response.status);
    const live = await response.json();
    if (!Array.isArray(live.archive) || !Array.isArray(live.forward)) throw new Error('Invalid observation feed');
    data.archive = live.archive;
    data.forward = live.forward;
    data.manual = Array.isArray(live.manual) ? live.manual : [];
    status.textContent = '観測記録 ' + fmt(live.archive.length) + 'レース ・ 締切前予測 ' + fmt(live.forward.length) + '件';
  } catch (error) {
    status.textContent = '観測記録を取得できませんでした。時間をおいて再読み込みしてください。';
  }
  status.hidden = false;
}
const mode = el('mode'), day = el('day'), venue = el('venue'), race = el('race'), sort = el('sort');
if (data.forward?.length || !data.replay?.length) mode.value = 'forward';
function options(select, values, label = v => v) {
  const prior = select.value;
  select.replaceChildren(...values.map(v => new Option(label(v), v)));
  if (values.includes(prior)) select.value = prior;
  select.disabled = values.length === 0;
}
const unique = values => [...new Set(values)];
const classes = {S:'S級',A:'A級',challenge:'チャレンジ'};
const labels = {
  settled:'仮想精算済み', pending:'予測あり・照合待ち', matched:'結果照合済み',
  card:'出走表保存', replay:'確定オッズ研究'
};
const resultLabels = {
  before_result_window:'結果確認時刻待ち', result_unavailable:'結果未取得',
  unverified_result:'2サイトの照合待ち', irregular_result:'欠場・失格・同着などの確認が必要',
  invalid_result:'結果データの検証失敗'
};
const quoteLabels = {t10:'締切10分前',t5:'締切5分前',probability:'確率のみ'};
function openPrediction(record, kind) {
  mode.value = kind;
  filter();
  day.value = record.date;
  filter();
  venue.value = record.venue;
  filter();
  race.value = record.key || record.race_id;
  render();
  el('heading').focus();
  el('detail').scrollIntoView({block:'start'});
}
const cardIndex = new Map((data.archive || []).map(row => [row.race_id, {...row, forecasts:[]}]));
for (const forecast of data.forward || []) {
  if (!cardIndex.has(forecast.race_id)) cardIndex.set(forecast.race_id, {...forecast, forecasts:[]});
  cardIndex.get(forecast.race_id).forecasts.push(forecast);
}
const normalize = value => value.toString().normalize('NFKC').toLowerCase()
  .replace(/[\u3041-\u3096]/g, letter => String.fromCharCode(letter.charCodeAt(0) + 0x60));
const archive = [...cardIndex.values(), ...(data.replay || []).map(row => ({...row, replay:true, forecasts:[]}))]
  .map(row => {
    const settled = row.forecasts.find(r => r.settlement);
    const kind = row.replay ? 'replay' : settled ? 'settled' :
      row.forecasts.length ? 'pending' : row.result ? 'matched' : 'card';
    const digits = row.date.replaceAll('-', '');
    const search = normalize([row.date, digits, row.venue, row.race_no+'R', row.race_no+'レース',
      row.cars.length+'車', classes[row.class] || row.class, labels[kind],
      ...(row.riders || []).map(([,name]) => name.replace(/\s/g,''))].join(' '));
    return {...row, kind, search, result:settled?.result || row.result};
  }).sort((a,b) => b.date.localeCompare(a.date) || Number(!!a.replay)-Number(!!b.replay) ||
    Date.parse(a.start)-Date.parse(b.start) || a.venue.localeCompare(b.venue, 'ja') || a.race_no-b.race_no);
const quickRace = el('quick-race'), quickSubmit = el('quick-submit'), quickStatus = el('quick-status');
const now = Date.now();
const today = new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(now);
const upcoming = [...cardIndex.values()].filter(row =>
  row.date === today && !row.result && !row.forecasts.some(r => r.quote_mode === 't10') &&
  Date.parse(row.sales_close || row.start) > now);
upcoming.sort((a,b) => Date.parse(a.start)-Date.parse(b.start) || a.venue.localeCompare(b.venue,'ja'));
const upcomingById = new Map(upcoming.map(row => [row.race_id,row]));
const closeTime = new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'});
options(quickRace, upcoming.map(row => row.race_id), key => {
  const row = upcomingById.get(key);
  return row.venue+' '+row.race_no+'R'+(row.sales_close ? ' ・ 締切 '+closeTime.format(new Date(row.sales_close)) : '');
});
function syncQuickRequest() {
  const row = upcomingById.get(quickRace.value);
  if (!row) return;
  const url = new URL('https://github.com/takashikamei2504-sys/tk-keirin-lab/issues/new');
  url.searchParams.set('title', '2T手動取得 '+row.date+':'+row.venue+':'+row.race_no);
  url.searchParams.set('body', '2Tレース台帳からの手動取得依頼です。会場とレース番号は入力済みです。');
  quickSubmit.href = url.href;
}
quickRace.addEventListener('change', syncQuickRequest);
quickSubmit.addEventListener('click', event => {
  const row = upcomingById.get(quickRace.value);
  if (row && Date.parse(row.sales_close || row.start) > Date.now()) return;
  event.preventDefault();
  quickStatus.textContent = 'このレースは受付時間を過ぎました。ページを再読み込みしてください。';
});
syncQuickRequest();
el('quick-controls').hidden = !upcoming.length;
quickStatus.textContent = upcoming.length ?
  'GitHubで「Create」を押すと受付。依頼は公開Issueに記録されます。' :
  '台帳に依頼できる当日のレースがありません。';
const manualLabels = {
  forecast_saved:'予想保存済み', closed:'締切前に保存できませんでした',
  checkpoint_unavailable:'予想モデルを読み込めませんでした', verification_failed:'データの検証に失敗しました',
  card_unavailable:'予想に必要な出走表がありません', window_missed:'オッズの取得時刻を過ぎました',
  window_not_open:'オッズの取得時刻より前です', no_forecast:'予想は保存されませんでした'
};
el('quick-refresh').addEventListener('click', () => location.reload());
const manualList = el('quick-results');
for (const row of data.manual || []) {
  const [date, label, number] = row.race_id.split(':');
  if (date !== today || !Object.hasOwn(manualLabels,row.status)) continue;
  const forecast = cardIndex.get(row.race_id)?.forecasts.find(r => r.quote_mode === 't10');
  const item = appendText(manualList, 'li', label+' '+number+'R ・ '+(forecast ? manualLabels.forecast_saved : manualLabels[row.status]));
  const detail = appendText(item, 'small', closeTime.format(new Date(row.finished_at))+'処理');
  if (Number.isSafeInteger(row.run_id) && row.run_id > 0) {
    const link = appendText(detail, 'a', ' ・ 実行詳細');
    link.href = 'https://github.com/takashikamei2504-sys/tk-keirin-lab/actions/runs/'+row.run_id;
  }
  if (forecast) {
    const actions = appendText(item, 'div', '', 'archive-actions');
    const button = appendText(actions, 'button', '予想を見る');
    button.type = 'button';
    button.addEventListener('click', () => openPrediction(forecast, 'forward'));
  }
}
el('quick-results-empty').hidden = manualList.children.length > 0;
const archiveDay = el('archive-day'), archiveVenue = el('archive-venue'), archiveField = el('archive-field');
const archiveState = el('archive-state'), archiveQuery = el('archive-query');
options(archiveDay, ['', ...unique(archive.map(row => row.date))], day => day || 'すべて');
options(archiveVenue, ['', ...unique(archive.map(row => row.venue)).sort((a,b) => a.localeCompare(b,'ja'))],
  venue => venue || 'すべて');
const archivePageSize = 12;
let archiveLimit = archivePageSize;
function appendText(parent, tag, value, className) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  node.textContent = value;
  parent.append(node);
  return node;
}
function archiveItem(row) {
  const item = document.createElement('li');
  const detail = document.createElement('details');
  const title = document.createElement('summary');
  item.append(detail);
  detail.append(title);
  const name = appendText(title, 'span', row.venue + ' ' + row.race_no + 'R', 'archive-title');
  appendText(name, 'small', row.date + ' ・ ' + (classes[row.class] || row.class) + ' ・ ' + row.cars.length + '車');
  appendText(title, 'span', labels[row.kind], 'tag');
  if (row.riders?.length) {
    appendText(detail, 'p', row.riders.map(([car, rider]) => car + ' ' + rider).join(' ／ '));
  }
  if (row.start) appendText(detail, 'small', '発走 ' + dateTime(row.start));
  if (row.saved_at) appendText(detail, 'small', '出走表保存 ' + dateTime(row.saved_at));
  if (!row.replay) {
    const quotedAt = row.quote_captured_at || row.forecasts.find(r => r.quote_mode === 't10')?.quote?.captured_at;
    appendText(detail, 'small', quotedAt ? '締切10分前オッズ取得 ' + dateTime(quotedAt) :
      row.quote_invalid ? '締切10分前オッズの検証失敗' : '締切10分前オッズ未保存');
  }
  const payouts = Object.entries(row.result?.payouts || {});
  appendText(detail, 'p', row.result?.cancelled ? '中止' : payouts.length ?
    '二車単結果 ' + payouts.map(([pair, yen]) => pair + '（' + fmt(yen) + '円）').join(' ／ ') :
    resultLabels[row.result_status] || '結果照合待ち');
  if (row.result_observed_at) appendText(detail, 'small', '結果照合 ' + dateTime(row.result_observed_at));
  const saved = row.forecasts.find(r => r.settlement)?.settlement;
  if (saved) appendText(detail, 'small',
    '仮想投資 ' + fmt(saved.stake) + '円 ・ 仮想払戻 ' + fmt(saved.returned) + '円');
  if (row.feature_sha256) appendText(detail, 'small', '入力SHA-256 ' + row.feature_sha256);
  if (row.replay || row.forecasts.length) {
    const actions = document.createElement('div');
    actions.className = 'archive-actions';
    detail.append(actions);
    for (const record of row.replay ? [row] : row.forecasts) {
      const button = appendText(actions, 'button', row.replay ? '研究記録を開く' :
        (quoteLabels[record.quote_mode] || '保存済み') + 'の予測を開く');
      button.type = 'button';
      button.addEventListener('click', () => openPrediction(record, row.replay ? 'replay' : 'forward'));
    }
  }
  return item;
}
function renderArchive(more = false) {
  const words = normalize(archiveQuery.value.trim()).split(/\s+/).filter(Boolean);
  const matches = archive.filter(row =>
    (!archiveDay.value || row.date === archiveDay.value) &&
    (!archiveVenue.value || row.venue === archiveVenue.value) &&
    (!archiveField.value || String(row.cars.length) === archiveField.value) &&
    (!archiveState.value || row.kind === archiveState.value) &&
    words.every(word => row.search.includes(word)));
  const list = el('archive-list');
  const start = more ? list.children.length : 0;
  if (!more) list.replaceChildren();
  list.append(...matches.slice(start, archiveLimit).map(archiveItem));
  el('archive-count').textContent = fmt(matches.length) + '件該当 / 全' + fmt(archive.length) + '件';
  el('archive-empty').hidden = matches.length > 0;
  el('archive-empty').textContent = archive.length ? '条件に合う記録がありません。' : '台帳に保存されたレースはありません。';
  el('archive-more').hidden = matches.length <= archiveLimit;
}
for (const control of [archiveDay, archiveVenue, archiveField, archiveState, archiveQuery]) {
  control.addEventListener(control === archiveQuery ? 'input' : 'change', () => {
    archiveLimit = archivePageSize;
    renderArchive();
  });
}
el('archive-more').addEventListener('click', () => {
  archiveLimit += archivePageSize;
  renderArchive(true);
});
renderArchive();
function filter() {
  const all = data[mode.value] || [];
  options(day, unique(all.map(r => r.date)).sort().reverse());
  const byDay = all.filter(r => r.date === day.value);
  options(venue, unique(byDay.map(r => r.venue)).sort((a,b) => a.localeCompare(b,'ja')));
  const byVenue = byDay.filter(r => r.venue === venue.value).sort((a,b) => a.race_no-b.race_no);
  options(race, byVenue.map(r => r.key || r.race_id), id => {
    const r = byVenue.find(r => (r.key || r.race_id) === id);
    return r.race_no + 'R ・ ' + (classes[r.class] || r.class)
      + ' ・ ' + r.cars.length + '車' + (r.quote_mode === 't5' ? ' ・ 5分前' : r.quote_mode === 'probability' ? ' ・ 確率のみ' : '');
  });
  render();
}
function render() {
  const r = (data[mode.value] || []).find(r => (r.key || r.race_id) === race.value);
  el('detail').hidden = !r;
  el('state').textContent = r ? '' : mode.value === 'forward' ?
    '締切前に固定した予測はまだありません。' : '公開済みの過去検証データがありません。';
  if (!r) return;
  const isReplay = mode.value === 'replay';
  const odds = r.quote?.odds;
  const account = isReplay ? null : r.settlement;
  el('heading').textContent = r.venue + ' ' + r.race_no + 'R ・ ' + r.cars.length + '車';
  const closed = !isReplay && Date.now() >= Date.parse(r.quote?.sales_close || r.start);
  el('status').textContent = isReplay ? '過去検証' : account ? '仮想精算済み' : closed ? '締切済み' : r.frozen_at ? '発走前固定済み' : '保存待ち';
  el('time').textContent = (isReplay ? '発走前資料の保存 ' : '予測の保存 ') + dateTime(r.frozen_at ?? r.input_as_of);
  el('source').textContent = isReplay ? '確定オッズ利用・実購入再現不可' : odds ?
    '締切' + (r.quote_mode === 't5' ? '5' : '10') + '分前 ・ 取得 ' + dateTime(r.quote.captured_at) : '締切前オッズなし・確率のみ';
  if (isReplay && r.result?.accident) el('source').textContent += ' ・ 論文比較対象外';
  const winners = Object.entries(r.result?.payouts || {});
  el('outcome').textContent = r.result?.cancelled ? '中止' : winners.length ?
    '二車単結果 ' + winners.map(([key, value]) => key + '（' + fmt(value) + '円）').join(' / ')
       + (r.settlement?.tickets ? ' ・ ' + (r.settlement.hits ? '的中 ' : '不的中 ') + fmt(r.settlement.returned) + '円' : '')
       + (r.cumulative_roi == null ? '' : ' ・ ' + r.cars.length + '車 累積回収率 ' + pct(r.cumulative_roi)) :
    '結果照合待ち';
  if (account) {
    const balance = account.returned - account.stake;
    el('outcome').textContent += ' ・ 仮想投資 ' + fmt(account.stake) + '円'
      + ' ・ 仮想収支 ' + (balance > 0 ? '+' : '') + fmt(balance) + '円';
  }
  const rows = Object.entries(r.probabilities).map(([key,p]) => {
    const o = odds?.[key] ?? null;
    return {key,p,o,ev:o === null ? null : p*o};
  }).sort((a,b) => sort.value === 'ev' && odds ? b.ev-a.ev || b.p-a.p : b.p-a.p);
  const buy = rows.filter(row => row.ev >= 1.5);
  const label = isReplay ? '仮想購入' : closed ? '当時の候補' : '購入候補';
  el('candidates').textContent = !odds ? 'オッズ待ち' : !buy.length ? '条件該当なし' :
    label + ' ' + buy.length + '点 ・ ' + fmt(buy.length*100) + '円 ｜ ' + buy.map(row => row.key).join('、');
  el('count').textContent = '二車単 ' + rows.length + '通り';
  el('tickets').replaceChildren(...rows.map(row => {
    const tr = document.createElement('tr');
    for (const value of [row.key,pct(row.p),row.o ?? '—',row.ev?.toFixed(2) ?? '—',row.ev === null ? '—' : row.ev >= 1.5 ? '該当' : '']) {
      tr.insertCell().textContent = value;
    }
    return tr;
  }));
}
for (const control of [mode, day, venue]) control.addEventListener('change', filter);
for (const control of [race, sort]) control.addEventListener('change', render);
filter();
</script>
</html>
